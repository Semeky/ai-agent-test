name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CXXFLAGS: -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Run built-in tests
        run: make test

      - name: Render frames and convert them
        run: |
          ./game3d --render /tmp/first-person.ppm --width 320 --height 180 --minimap
          ./game3d --render /tmp/overhead.ppm --width 320 --height 180 --map
          ./game3d --render /tmp/driving.ppm --width 320 --height 180 --drive 0
          python3 tools/ppm_to_png.py /tmp/first-person.ppm /tmp/first-person.png
          python3 tools/ppm_to_png.py /tmp/overhead.ppm /tmp/overhead.png
          python3 tools/ppm_to_png.py /tmp/driving.ppm /tmp/driving.png
          test -s /tmp/first-person.png
          test -s /tmp/overhead.png
          test -s /tmp/driving.png
